name: ConversationAI
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${TEAM_ID}
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  ConversationAI:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.conversationai
        PRODUCT_NAME: ConversationAI
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Config/Info.plist
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Jeeves
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Jeeves records audio only when you press Record, so it can transcribe and summarise your meetings and lectures.
        NSSpeechRecognitionUsageDescription: Jeeves turns your speech into live text on this device, so you can read the transcript as you record.
        UIBackgroundModes: [audio]
        UIAppFonts: [BebasNeue-Regular.ttf]
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
